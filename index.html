<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#08050b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <title>愿你一路繁花</title>
  <style>
    :root {
      --vh: 1vh;
      --rose: #ff6f9f;
      --rose-light: #ffd4e3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      color: #fff8fb;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 39%, rgba(119, 25, 62, 0.18), transparent 38%),
        radial-gradient(circle at 50% 115%, rgba(65, 16, 48, 0.22), transparent 44%),
        linear-gradient(180deg, #0b0710 0%, #07050a 58%, #0a060c 100%);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 43%, rgba(0, 0, 0, 0.38) 110%);
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .blessings {
      position: absolute;
      z-index: 4;
      top: auto;
      bottom: calc(23% + env(safe-area-inset-bottom));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      height: 3.2em;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
    }

    .line {
      grid-area: 1 / 1;
      margin: 0;
      width: 100%;
      opacity: 0;
      color: #fff9fb;
      font-size: clamp(22px, 6vw, 29px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
      text-shadow:
        0 0 8px rgba(255, 218, 231, 0.66),
        0 0 24px rgba(255, 83, 145, 0.35);
      will-change: opacity, transform, filter;
      transform: translateY(12px) scale(.97);
      filter: blur(7px);
      transition:
        opacity .72s cubic-bezier(.22, .78, .28, 1),
        transform .72s cubic-bezier(.22, .78, .28, 1),
        filter .72s ease;
    }

    .line.is-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .line.is-past {
      opacity: 0;
      transform: translateY(-9px) scale(1.015);
      filter: blur(6px);
    }

    .line:nth-child(4) {
      color: #fffdfd;
    }

    @media (max-height: 720px) {
      .blessings {
        top: auto;
        bottom: calc(13% + env(safe-area-inset-bottom));
      }

      .line {
        font-size: clamp(21px, 5.8vw, 25px);
      }
    }

    @media (orientation: landscape) {
      .blessings {
        top: auto;
        bottom: max(9%, env(safe-area-inset-bottom));
      }

      .line {
        font-size: clamp(19px, 3.5vw, 25px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .line {
        transition-duration: .25s;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="心形粒子祝福动画">
    <canvas id="heart" aria-hidden="true"></canvas>
    <section class="blessings" aria-live="polite" aria-label="祝福语">
      <p class="line">愿你一路繁花</p>
      <p class="line">所念皆所愿</p>
      <p class="line">所遇皆所求</p>
      <p class="line">未来皆可期</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('heart');
      const scene = document.querySelector('.scene');
      const messageLines = Array.prototype.slice.call(document.querySelectorAll('.line'));
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const TAU = Math.PI * 2;
      const MESSAGE_TIMES = [2000, 5000, 8000, 11000];
      const CONFIG = Object.freeze({
        heartColor: '#ea80b0',
        heartLight: '#ffd4e5',
        backgroundColor: '#050207',
        openingTrailColor: 'rgba(5, 2, 7, 0.42)',
        trailColor: 'rgba(5, 2, 7, 0.24)',
        dprLimit: 2,
        minParticles: 900,
        maxParticles: 1650,
        formationSeconds: 2,
        beatSeconds: 1.48,
        spread: 0.92
      });

      let width = 1;
      let height = 1;
      let dpr = 1;
      let count = 0;
      let centerX = 0;
      let centerY = 0;
      let heartScale = 1;
      let animationFrame = 0;
      let resizeFrame = 0;
      let resizeTimer = 0;
      let startTime = performance.now();
      let lastFrameTime = startTime;
      let messageTimers = [];

      const curveX = [];
      const curveY = [];

      let baseX = new Float32Array(0);
      let baseY = new Float32Array(0);
      let offsetX = new Float32Array(0);
      let offsetY = new Float32Array(0);
      let currentX = new Float32Array(0);
      let currentY = new Float32Array(0);
      let px = new Float32Array(0);
      let py = new Float32Array(0);
      let size = new Float32Array(0);
      let phase = new Float32Array(0);
      let speed = new Float32Array(0);

      function sampleHeartCurve() {
        for (let t = 0; t < TAU; t += 0.02) {
          const sinT = Math.sin(t);
          const x = 16 * sinT * sinT * sinT;
          const y = -(
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t)
          );
          curveX.push(x);
          curveY.push(y);
        }
      }

      function seededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        };
      }

      function updateViewportHeight() {
        const viewportHeight = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
        document.documentElement.style.setProperty('--vh', `${viewportHeight * 0.01}px`);
      }

      function buildParticles() {
        const areaAdjustedCount = 900 + Math.max(0, width * height - 250000) / 225;
        count = Math.max(CONFIG.minParticles, Math.min(CONFIG.maxParticles, Math.round(areaAdjustedCount)));
        baseX = new Float32Array(count);
        baseY = new Float32Array(count);
        offsetX = new Float32Array(count);
        offsetY = new Float32Array(count);
        currentX = new Float32Array(count);
        currentY = new Float32Array(count);
        px = new Float32Array(count);
        py = new Float32Array(count);
        size = new Float32Array(count);
        phase = new Float32Array(count);
        speed = new Float32Array(count);

        const random = seededRandom(20260818 + count);
        const alreadyFormed = (performance.now() - startTime) * 0.001 >= CONFIG.formationSeconds;

        for (let i = 0; i < count; i += 1) {
          const curveIndex = Math.floor(random() * curveX.length);
          const outline = random() < 0.34;
          const layer = outline ? 0.95 + random() * 0.05 : Math.sqrt(random()) * 0.92;
          const distance = Math.sqrt(random()) * CONFIG.spread * (outline ? 0.55 : 1);
          const angle = random() * TAU;

          baseX[i] = curveX[curveIndex] * layer;
          baseY[i] = curveY[curveIndex] * layer;
          offsetX[i] = Math.cos(angle) * distance;
          offsetY[i] = Math.sin(angle) * distance;
          if (!outline && Math.abs(baseX[i]) < 1.2) {
            offsetX[i] += (random() - 0.5) * 1.7;
          }
          size[i] = 0.5 + random() * 1.5;
          phase[i] = random() * TAU;
          speed[i] = 0.55 + random() * 1.25;

          const targetX = centerX + (baseX[i] + offsetX[i]) * heartScale;
          const targetY = centerY + (baseY[i] + offsetY[i]) * heartScale;
          currentX[i] = alreadyFormed ? targetX : random() * width;
          currentY[i] = alreadyFormed ? targetY : random() * height;
        }
      }

      function heartbeatAt(seconds) {
        const cycle = (seconds % CONFIG.beatSeconds) / CONFIG.beatSeconds;
        const primary = Math.exp(-Math.pow((cycle - 0.105) / 0.052, 2));
        const recoil = -0.16 * Math.exp(-Math.pow((cycle - 0.19) / 0.045, 2));
        const secondary = 0.44 * Math.exp(-Math.pow((cycle - 0.285) / 0.072, 2));
        return Math.max(0, primary + recoil + secondary);
      }

      function resize() {
        updateViewportHeight();
        const rect = scene.getBoundingClientRect();
        width = Math.max(1, Math.round(rect.width));
        height = Math.max(1, Math.round(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprLimit);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        centerX = width * .5;
        centerY = height * (height < 720 ? .405 : .41);
        heartScale = Math.min((width * .8) / 32, (height * .43) / 29);
        ctx.fillStyle = CONFIG.backgroundColor;
        ctx.fillRect(0, 0, width, height);
        buildParticles();
      }

      function scheduleResize() {
        if (!resizeFrame) {
          resizeFrame = requestAnimationFrame(() => {
            resizeFrame = 0;
            updateViewportHeight();
          });
        }
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resize, 120);
      }

      function showMessage(index) {
        for (let i = 0; i < messageLines.length; i += 1) {
          messageLines[i].classList.remove('is-active', 'is-past');
          if (i === index) messageLines[i].classList.add('is-active');
          else if (i < index) messageLines[i].classList.add('is-past');
        }
      }

      function stopMessageTimeline() {
        for (let i = 0; i < messageTimers.length; i += 1) {
          window.clearTimeout(messageTimers[i]);
        }
        messageTimers = [];
      }

      function startMessageTimeline() {
        stopMessageTimeline();
        showMessage(-1);
        for (let i = 0; i < MESSAGE_TIMES.length; i += 1) {
          messageTimers.push(window.setTimeout(() => showMessage(i), MESSAGE_TIMES[i]));
        }
      }

      function render(now) {
        const deltaSeconds = Math.min(0.034, Math.max(0.001, (now - lastFrameTime) * 0.001));
        lastFrameTime = now;
        const seconds = (now - startTime) * .001;
        const formation = Math.min(1, seconds / CONFIG.formationSeconds);
        const eased = 1 - Math.pow(1 - formation, 3);
        const heartbeat = heartbeatAt(seconds);
        const breathe = 1 + Math.sin(seconds * 1.05) * 0.007;
        const pulseScale = heartScale * (breathe + heartbeat * 0.045);
        const gatherRatio = 1 - heartbeat * 0.3;
        const floatY = Math.sin(seconds * 0.76) * 1.6;
        const followRate = formation < 1 ? 1.6 + formation * 4.5 : 9.5;
        const follow = 1 - Math.exp(-followRate * deltaSeconds);
        const formationAlpha = 0.12 + eased * 0.88;

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.fillStyle = formation < 0.55 ? CONFIG.openingTrailColor : CONFIG.trailColor;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < count; i += 1) {
          const localPhase = phase[i] + seconds * speed[i];
          const floatingX = Math.cos(localPhase) * 1.5;
          const floatingY = Math.sin(localPhase * 1.07) * 1.5;
          const targetX = centerX
            + baseX[i] * pulseScale
            + offsetX[i] * heartScale * gatherRatio
            + floatingX;
          const targetY = centerY
            + baseY[i] * pulseScale
            + offsetY[i] * heartScale * gatherRatio
            + floatingY
            + floatY;

          currentX[i] += (targetX - currentX[i]) * follow;
          currentY[i] += (targetY - currentY[i]) * follow;
          px[i] = currentX[i];
          py[i] = currentY[i];
        }

        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        for (let i = 0; i < count; i += 1) {
          const shimmer = 0.82 + Math.sin(seconds * speed[i] * 2.2 + phase[i]) * 0.18;
          const radius = size[i] * shimmer;
          ctx.moveTo(px[i] + radius, py[i]);
          ctx.arc(px[i], py[i], radius, 0, TAU);
        }
        ctx.fillStyle = CONFIG.heartColor;
        ctx.globalAlpha = 0.58 * formationAlpha;
        ctx.fill();

        ctx.shadowBlur = 5;
        ctx.shadowColor = CONFIG.heartColor;
        ctx.beginPath();
        for (let i = 0; i < count; i += 5) {
          const shimmer = 0.82 + Math.sin(seconds * speed[i] * 2.2 + phase[i]) * 0.18;
          const radius = size[i] * shimmer * 0.92;
          ctx.moveTo(px[i] + radius, py[i]);
          ctx.arc(px[i], py[i], radius, 0, TAU);
        }
        ctx.fillStyle = CONFIG.heartLight;
        ctx.globalAlpha = 0.62 * formationAlpha;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        animationFrame = requestAnimationFrame(render);
      }

      function start() {
        sampleHeartCurve();
        resize();
        startTime = performance.now();
        lastFrameTime = startTime;
        startMessageTimeline();
        animationFrame = requestAnimationFrame(render);
      }

      window.addEventListener('resize', scheduleResize, { passive: true });
      window.addEventListener('orientationchange', scheduleResize, { passive: true });
      window.addEventListener('pageshow', event => {
        scheduleResize();
        if (event.persisted) startMessageTimeline();
      }, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleResize, { passive: true });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          stopMessageTimeline();
        } else if (!animationFrame) {
          lastFrameTime = performance.now();
          startMessageTimeline();
          animationFrame = requestAnimationFrame(render);
        }
      });

      start();
    })();
  </script>
</body>
</html>
