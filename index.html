<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>愿你一路繁花</title>
  <style>
    :root {
      --vh: 1vh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      color: #fff9ff;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
      overflow: hidden;
      isolation: isolate;
      background: #000;
      -webkit-perspective: 900px;
      perspective: 900px;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 38%, transparent 36%, rgba(0, 0, 0, .14) 72%, rgba(0, 0, 0, .42) 118%);
    }

    .heart-stage,
    .falling-layer,
    .floor-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .heart-stage {
      z-index: 2;
      transform-origin: 50% 50%;
      animation: heartBreath 4.8s cubic-bezier(.42, 0, .26, 1) 1.9s infinite;
      will-change: transform;
    }

    .heart-cloud {
      position: absolute;
      left: var(--heart-x, 50%);
      top: var(--heart-y, 30%);
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transform: rotateX(-4deg) rotateY(-2deg);
    }

    .heart-particle {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size);
      height: var(--size);
      margin: calc(var(--size) * -.5) 0 0 calc(var(--size) * -.5);
      border-radius: var(--radius);
      background: var(--color);
      box-shadow: 0 0 var(--glow) var(--color);
      opacity: 0;
      filter: blur(var(--blur));
      transform: translate3d(var(--scatter-x), var(--scatter-y), var(--scatter-z)) scale(.28);
      transition:
        transform var(--settle-time) cubic-bezier(.22, .65, .28, 1),
        opacity 1.15s ease;
      transition-delay: var(--settle-delay);
      will-change: transform, opacity;
    }

    .heart-particle::before,
    .falling-particle::before,
    .floor-particle::before {
      content: "";
      position: absolute;
      left: 14%;
      top: 14%;
      width: 72%;
      height: 72%;
      border-radius: inherit;
      background: var(--color);
      opacity: .58;
      box-shadow: var(--satellites);
    }

    .heart-particle::before { opacity: .72; }

    .scene.is-ready .heart-particle {
      opacity: var(--opacity);
      transform: translate3d(var(--x), var(--y), var(--z)) scale(1);
    }

    .scene.is-settled .heart-particle {
      transition: none;
      will-change: auto;
    }

    .heart-particle.spark::after {
      content: "";
      position: absolute;
      inset: -70%;
      border-radius: 50%;
      background: currentColor;
      color: var(--color);
      opacity: 0;
      transform: scale(.28);
      animation: sparkle var(--spark-time) ease-in-out var(--spark-delay) infinite;
    }

    .falling-layer {
      z-index: 1;
      transform: translateZ(-14px);
    }

    .falling-particle {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) * -.5);
      border-radius: 42% 58% 54% 46%;
      background: var(--color);
      box-shadow: 0 0 var(--glow) var(--color);
      opacity: 0;
      transform: translate3d(var(--start-x), var(--start-y), var(--z)) scale(.4);
      animation: particleFall var(--fall-time) cubic-bezier(.28, .05, .66, .96) var(--fall-delay) infinite;
      will-change: transform, opacity;
    }

    .floor-layer {
      z-index: 1;
      transform: translateZ(-28px) rotateX(52deg);
      transform-origin: 50% 92%;
      animation: floorBreath 5.4s ease-in-out 2s infinite;
    }

    .floor-particle {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--size);
      height: var(--size);
      margin: calc(var(--size) * -.5) 0 0 calc(var(--size) * -.5);
      border-radius: var(--radius);
      background: var(--color);
      box-shadow: 0 0 var(--glow) var(--color);
      opacity: var(--opacity);
      transform: translate3d(var(--x), var(--y), var(--z));
    }

    .blessings {
      position: absolute;
      z-index: 5;
      left: max(24px, var(--safe-left));
      right: max(24px, var(--safe-right));
      bottom: calc(21.5% + var(--safe-bottom));
      height: 3.2em;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
    }

    .line {
      grid-area: 1 / 1;
      width: 100%;
      margin: 0;
      opacity: 0;
      color: #fff9ff;
      font-size: clamp(21px, 5.8vw, 28px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: .16em;
      text-indent: .16em;
      white-space: nowrap;
      text-shadow:
        0 0 7px rgba(255, 235, 255, .76),
        0 0 19px rgba(220, 127, 255, .42);
      transform: translate3d(0, 12px, 0) scale(.97);
      filter: blur(7px);
      transition:
        opacity .72s cubic-bezier(.22, .78, .28, 1),
        transform .72s cubic-bezier(.22, .78, .28, 1),
        filter .72s ease;
      will-change: opacity, transform, filter;
    }

    .line.is-active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0);
    }

    .line.is-past {
      opacity: 0;
      transform: translate3d(0, -9px, 0) scale(1.015);
      filter: blur(6px);
    }

    .scene.is-paused .heart-stage,
    .scene.is-paused .falling-particle,
    .scene.is-paused .floor-layer,
    .scene.is-paused .heart-particle::after {
      animation-play-state: paused !important;
    }

    @keyframes heartBreath {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotateZ(-.15deg); }
      34% { transform: translate3d(0, -3px, 7px) scale(1.012) rotateZ(.15deg); }
      42% { transform: translate3d(0, -4px, 11px) scale(1.048); }
      49% { transform: translate3d(0, -2px, 5px) scale(1.009); }
      57% { transform: translate3d(0, -3px, 8px) scale(1.025); }
      67% { transform: translate3d(0, -1px, 2px) scale(1.004); }
    }

    @keyframes sparkle {
      0%, 72%, 100% { opacity: 0; transform: scale(.25); }
      82% { opacity: .55; transform: scale(1); }
      90% { opacity: .08; transform: scale(.55); }
    }

    @keyframes particleFall {
      0% {
        opacity: 0;
        transform: translate3d(var(--start-x), var(--start-y), var(--z)) scale(.3);
      }
      12% { opacity: var(--opacity); }
      72% { opacity: calc(var(--opacity) * .82); }
      100% {
        opacity: 0;
        transform: translate3d(calc(var(--start-x) + var(--drift)), var(--end-y), 0px) scale(1.05);
      }
    }

    @keyframes floorBreath {
      0%, 100% { opacity: .78; }
      50% { opacity: 1; }
    }

    @media (max-height: 720px) {
      .blessings { bottom: calc(15.5% + var(--safe-bottom)); }
      .line { font-size: clamp(20px, 5.5vw, 24px); }
    }

    @media (orientation: landscape) {
      .blessings {
        left: 55%;
        right: max(5%, var(--safe-right));
        bottom: calc(39% + var(--safe-bottom));
      }

      .line { font-size: clamp(18px, 3.4vw, 24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-stage { animation-duration: 7s; }
      .heart-particle { transition-duration: .7s, .5s; }
      .line { transition-duration: .25s; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="粒子爱心祝福动画">
    <div class="heart-stage" aria-hidden="true">
      <div class="heart-cloud" id="heartCloud"></div>
    </div>
    <div class="falling-layer" id="fallingLayer" aria-hidden="true"></div>
    <div class="floor-layer" id="floorLayer" aria-hidden="true"></div>
    <section class="blessings" aria-live="polite" aria-label="祝福语">
      <p class="line">愿你一路繁花</p>
      <p class="line">所念皆所愿</p>
      <p class="line">所遇皆所求</p>
      <p class="line">未来皆可期</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const scene = document.querySelector('.scene');
      const heartCloud = document.getElementById('heartCloud');
      const fallingLayer = document.getElementById('fallingLayer');
      const floorLayer = document.getElementById('floorLayer');
      const messageLines = Array.prototype.slice.call(document.querySelectorAll('.line'));
      const MESSAGE_TIMES = [2000, 5000, 8000, 11000];
      const TAU = Math.PI * 2;
      const HEART_COLORS = ['#d98cff', '#e9a3ff', '#f2bbff', '#ca77f4', '#f7d2ff'];
      const FLOOR_COLORS = ['#b76ce8', '#d487ff', '#e6adff', '#9d61d1'];
      let resizeTimer = 0;
      let buildVersion = 0;
      let messageTimers = [];

      function seededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        };
      }

      function px(value) { return `${value.toFixed(2)}px`; }

      function updateViewportHeight() {
        const height = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
        document.documentElement.style.setProperty('--vh', `${height * .01}px`);
      }

      function pickCounts(width) {
        if (width <= 375) return { heart: 250, falling: 42, floor: 66 };
        if (width <= 395) return { heart: 280, falling: 48, floor: 78 };
        return { heart: 310, falling: 54, floor: 88 };
      }

      function heartPoint(t) {
        const sinT = Math.sin(t);
        return {
          x: 16 * sinT * sinT * sinT,
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        };
      }

      function addStyle(element, values) {
        const keys = Object.keys(values);
        for (let i = 0; i < keys.length; i += 1) element.style.setProperty(keys[i], values[keys[i]]);
      }

      function makeSatelliteShadows(random, count, xSpread, ySpread) {
        const shadows = [];
        for (let i = 0; i < count; i += 1) {
          const blur = random() < .18 ? px(random() * 1.1) : '0px';
          shadows.push(`${px((random() - .5) * xSpread)} ${px((random() - .5) * ySpread)} ${blur} var(--color)`);
        }
        return shadows.join(',');
      }

      function pointInPolygon(x, y, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
          const a = polygon[i];
          const b = polygon[j];
          const crosses = (a.y > y) !== (b.y > y)
            && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x;
          if (crosses) inside = !inside;
        }
        return inside;
      }

      function makeHeartParticles(fragment, count, geometry, random) {
        const scatterRadius = Math.max(geometry.width, geometry.height) * .92;
        const polygon = [];
        for (let i = 0; i < 180; i += 1) polygon.push(heartPoint((i / 180) * TAU));
        for (let i = 0; i < count; i += 1) {
          const edgeParticle = random() < .28;
          let point;
          if (edgeParticle) {
            point = heartPoint(random() * TAU);
          } else {
            do {
              point = { x: random() * 32 - 16, y: random() * 29 - 12 };
            } while (!pointInPolygon(point.x, point.y, polygon));
          }
          const depth = (random() * 2 - 1) * geometry.depth;
          const depthShape = .84 + Math.sqrt(Math.max(0, 1 - Math.pow(depth / geometry.depth, 2))) * .16;
          const jitter = edgeParticle ? 3.2 : 2.1;
          const edgeScale = edgeParticle ? .96 + random() * .08 : 1;
          const x = point.x * geometry.scale * edgeScale * depthShape + (random() - .5) * jitter;
          const y = point.y * geometry.scale * geometry.yRatio * edgeScale * depthShape + (random() - .5) * jitter;
          const scatterAngle = random() * TAU;
          const scatterDistance = scatterRadius * (.45 + random() * .8);
          const size = (edgeParticle ? 1.45 : 1.25) + random() * (edgeParticle ? 3.35 : 3.05);
          const particle = document.createElement('i');
          const bright = random() < .2;
          particle.className = bright ? 'heart-particle spark' : 'heart-particle';
          addStyle(particle, {
            '--x': px(x), '--y': px(y), '--z': px(depth),
            '--scatter-x': px(Math.cos(scatterAngle) * scatterDistance),
            '--scatter-y': px(Math.sin(scatterAngle) * scatterDistance),
            '--scatter-z': px((random() * 2 - 1) * 170),
            '--size': px(size),
            '--radius': `${34 + random() * 32}% ${39 + random() * 27}% ${35 + random() * 31}% ${40 + random() * 25}%`,
            '--color': HEART_COLORS[Math.floor(random() * HEART_COLORS.length)],
            '--satellites': makeSatelliteShadows(random, 12, 20, 20),
            '--glow': px(bright ? 4 + random() * 5 : random() < .24 ? 2 + random() * 2 : 0),
            '--blur': px(random() < .08 ? .55 : 0),
            '--opacity': (.62 + random() * .36).toFixed(2),
            '--settle-time': `${1.55 + random() * .45}s`,
            '--settle-delay': `${random() * .28}s`,
            '--spark-time': `${2.8 + random() * 3.4}s`,
            '--spark-delay': `${-random() * 6}s`
          });
          fragment.appendChild(particle);
        }
      }

      function makeFallingParticles(fragment, count, geometry, random) {
        for (let i = 0; i < count; i += 1) {
          const particle = document.createElement('i');
          const size = .9 + random() * 3.2;
          const startX = (random() - .5) * geometry.width * .34;
          const drift = (random() - .5) * geometry.width * (.42 + random() * .36);
          particle.className = 'falling-particle';
          addStyle(particle, {
            '--start-x': px(startX), '--start-y': px(geometry.startY + random() * 20),
            '--end-y': px(geometry.endY + random() * 20), '--drift': px(drift),
            '--z': px((random() * 2 - 1) * 62), '--size': px(size),
            '--color': HEART_COLORS[Math.floor(random() * HEART_COLORS.length)],
            '--satellites': makeSatelliteShadows(random, 6, 12, 15),
            '--glow': px(random() < .28 ? 3 + random() * 4 : random()),
            '--opacity': (.35 + random() * .5).toFixed(2),
            '--fall-time': `${4.7 + random() * 4.8}s`, '--fall-delay': `${1.05 + random() * 5.8}s`
          });
          fragment.appendChild(particle);
        }
      }

      function makeFloorParticles(fragment, count, geometry, random) {
        for (let i = 0; i < count; i += 1) {
          const average = (random() + random() + random()) / 3;
          const x = (average - .5) * geometry.width * 1.42;
          const normalized = Math.min(1, Math.abs(x) / (geometry.width * .71));
          const thickness = geometry.thickness * (.28 + (1 - normalized * normalized) * .72);
          const y = geometry.centerY + (random() - .5) * thickness;
          const size = .9 + random() * 3.9;
          const particle = document.createElement('i');
          addStyle(particle, {
            '--x': px(x), '--y': px(y), '--z': px((random() * 2 - 1) * 42), '--size': px(size),
            '--radius': `${35 + random() * 30}% ${38 + random() * 28}% ${34 + random() * 31}% ${38 + random() * 27}%`,
            '--color': FLOOR_COLORS[Math.floor(random() * FLOOR_COLORS.length)],
            '--satellites': makeSatelliteShadows(random, 8, 20, 10),
            '--glow': px(random() < .2 ? 3 + random() * 5 : random() * 1.6),
            '--opacity': (.32 + random() * .5).toFixed(2),
            '--spark-time': `${3 + random() * 5}s`, '--spark-delay': `${-random() * 7}s`
          });
          particle.className = 'floor-particle';
          fragment.appendChild(particle);
        }
      }

      function buildScene() {
        buildVersion += 1;
        const rect = scene.getBoundingClientRect();
        const width = Math.max(1, rect.width);
        const height = Math.max(1, rect.height);
        const landscape = width > height;
        const counts = pickCounts(Math.min(width, height));
        const heartWidth = Math.min(landscape ? width * .39 : width * .8, height * (landscape ? .62 : .39), 350);
        const heartHeight = heartWidth * .79;
        const heartX = landscape ? width * .35 : width * .5;
        const heartY = landscape ? height * .47 : height * (height < 720 ? .31 : .3);
        const floorCenterY = height - (landscape ? 34 : height < 720 ? 57 : 72);
        const floorThickness = landscape ? 31 : height < 720 ? 45 : 58;
        const random = seededRandom(20260818 + Math.round(width) * 31 + Math.round(height) * 17 + buildVersion);
        const heartFragment = document.createDocumentFragment();
        const fallingFragment = document.createDocumentFragment();
        const floorFragment = document.createDocumentFragment();

        scene.classList.remove('is-ready');
        scene.classList.remove('is-settled');
        heartCloud.style.setProperty('--heart-x', px(heartX));
        heartCloud.style.setProperty('--heart-y', px(heartY));
        makeHeartParticles(heartFragment, counts.heart, {
          width: heartWidth, height: heartHeight, scale: heartWidth / 32, yRatio: .79,
          depth: Math.max(34, heartWidth * .17)
        }, random);
        makeFallingParticles(fallingFragment, counts.falling, {
          width: heartWidth, startY: heartY + heartHeight * .43,
          endY: floorCenterY - floorThickness * .42
        }, random);
        makeFloorParticles(floorFragment, counts.floor, {
          width, centerY: floorCenterY, thickness: floorThickness
        }, random);

        heartCloud.replaceChildren(heartFragment);
        fallingLayer.replaceChildren(fallingFragment);
        floorLayer.replaceChildren(floorFragment);
        requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('is-ready')));
        window.setTimeout(() => scene.classList.add('is-settled'), 2400);
      }

      function scheduleResize() {
        updateViewportHeight();
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(buildScene, 140);
      }

      function showMessage(index) {
        for (let i = 0; i < messageLines.length; i += 1) {
          messageLines[i].classList.remove('is-active', 'is-past');
          if (i === index) messageLines[i].classList.add('is-active');
          else if (i < index) messageLines[i].classList.add('is-past');
        }
      }

      function stopMessageTimeline() {
        for (let i = 0; i < messageTimers.length; i += 1) window.clearTimeout(messageTimers[i]);
        messageTimers = [];
      }

      function startMessageTimeline() {
        stopMessageTimeline();
        showMessage(-1);
        for (let i = 0; i < MESSAGE_TIMES.length; i += 1) {
          messageTimers.push(window.setTimeout(() => showMessage(i), MESSAGE_TIMES[i]));
        }
      }

      window.addEventListener('resize', scheduleResize, { passive: true });
      window.addEventListener('orientationchange', scheduleResize, { passive: true });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize, { passive: true });
      window.addEventListener('pageshow', event => {
        scheduleResize();
        if (event.persisted) startMessageTimeline();
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        scene.classList.toggle('is-paused', document.hidden);
        if (document.hidden) stopMessageTimeline();
        else startMessageTimeline();
      });

      updateViewportHeight();
      buildScene();
      startMessageTimeline();
    })();
  </script>
</body>
</html>
